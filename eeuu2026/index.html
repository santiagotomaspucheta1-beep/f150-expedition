function renderCalendar() {
  const container = document.getElementById("page-cal");
  if (!container) return;

  const stops = state.stops;
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = today.toISOString().split('T')[0];

  // — Stats —
  const stopsWithDates = stops.filter(s => s.start && s.end);
  const allStarts = stopsWithDates.map(s => new Date(s.start + 'T00:00:00'));
  const allEnds   = stopsWithDates.map(s => new Date(s.end   + 'T00:00:00'));
  let globalMin = allStarts.length ? new Date(Math.min(...allStarts)) : new Date('2026-08-10T00:00:00');
  let globalMax = allEnds.length   ? new Date(Math.max(...allEnds))   : new Date('2026-10-15T00:00:00');
  const tripDays = allStarts.length && allEnds.length ? Math.round((globalMax - globalMin) / 86400000) + 1 : 0;

  const year = calCurrentDate.getFullYear();
  const month = calCurrentDate.getMonth(); // 0-11

  const fullMonths = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const months = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const dayNames = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];

  // ── Stats bar ─────────────────────────────────────────
  let html = `<div class="cal-stats">
    <div class="cal-stat-card"><div class="val">${stops.length}</div><div class="lbl">Destinos</div></div>
    <div class="cal-stat-card"><div class="val">${tripDays}</div><div class="lbl">Días de viaje</div></div>
    <div class="cal-stat-card"><div class="val">${months[globalMin.getMonth()]}&nbsp;→&nbsp;${months[globalMax.getMonth()]}</div><div class="lbl">Período</div></div>
    <div class="cal-stat-card"><div class="val">${stopsWithDates.length}</div><div class="lbl">Con fechas</div></div>
  </div>`;

  // ── Layout ────────────────────────────────────────────
  html += `<div class="cal-layout">`;

  // ── Calendar Container ───────────────────────────
  html += `<div class="calendar-container">`;

  // Navigation Header
  html += `<div class="calendar-nav-header">`;
  
  html += `<div class="calendar-month-selector">`;
  html += `<button class="calendar-nav-btn" onclick="calPrevMonth()">◀</button>`;
  html += `<div class="calendar-month-title">${fullMonths[month]} ${year}</div>`;
  html += `<button class="calendar-nav-btn" onclick="calNextMonth()">▶</button>`;
  html += `</div>`;

  html += `<div class="calendar-quick-months">`;
  const quicks = [];
  let curr = new Date(globalMin.getFullYear(), globalMin.getMonth(), 1);
  const endLimit = new Date(globalMax.getFullYear(), globalMax.getMonth(), 1);
  let loopCount = 0;
  while (curr <= endLimit && loopCount < 48) {
    loopCount++;
    const y = curr.getFullYear();
    const m = curr.getMonth();
    const suffix = y === 2026 ? "" : " '" + String(y).slice(-2);
    quicks.push({
      name: months[m] + suffix,
      y: y,
      m: m
    });
    curr.setMonth(curr.getMonth() + 1);
  }
  quicks.forEach(q => {
    const activeClass = (year === q.y && month === q.m) ? 'active' : '';
    html += `<button class="calendar-quick-btn ${activeClass}" onclick="calSetMonth(${q.y}, ${q.m})">${q.name}</button>`;
  });
  html += `</div>`;

  html += `</div>`; // navigation-header

  // Day names headers
  html += `<div class="calendar-grid-header">`;
  dayNames.forEach(dName => {
    html += `<div class="calendar-day-header">${dName}</div>`;
  });
  html += `</div>`;

  // --- CALCULATE WEEKS ---
  const firstDay = new Date(year, month, 1);
  const firstDayOfWeekRaw = firstDay.getDay(); // 0 (Sun) - 6 (Sat)
  const firstDayOfWeek = firstDayOfWeekRaw === 0 ? 6 : firstDayOfWeekRaw - 1; // 0 (Mon) - 6 (Sun)
  
  const totalDaysInMonth = new Date(year, month + 1, 0).getDate();
  const totalDaysInPrevMonth = new Date(year, month, 0).getDate();
  
  const dayList = [];
  // Prev month padding
  for (let i = firstDayOfWeek - 1; i >= 0; i--) {
    const dayNum = totalDaysInPrevMonth - i;
    dayList.push({
      date: new Date(year, month - 1, dayNum),
      isCurrentMonth: false,
      dayNum: dayNum
    });
  }
  // Current month days
  for (let i = 1; i <= totalDaysInMonth; i++) {
    dayList.push({
      date: new Date(year, month, i),
      isCurrentMonth: true,
      dayNum: i
    });
  }
  // Next month padding to complete 7-day groups
  const nextMonthPaddingCount = (7 - (dayList.length % 7)) % 7;
  for (let i = 1; i <= nextMonthPaddingCount; i++) {
    dayList.push({
      date: new Date(year, month + 1, i),
      isCurrentMonth: false,
      dayNum: i
    });
  }

  // Segment dayList into weeks
  const weeks = [];
  for (let i = 0; i < dayList.length; i += 7) {
    weeks.push(dayList.slice(i, i + 7));
  }

  // --- RENDER WEEKS ---
  let gridWeeksHtml = '';
  weeks.forEach(week => {
    // Dates in YYYY-MM-DD
    const weekDatesStr = week.map(d => d.date.toISOString().split('T')[0]);
    const weekStartStr = weekDatesStr[0];
    const weekEndStr = weekDatesStr[6];

    // Find stops overlapping with this week
    const weekStops = [];
    stops.forEach((s, idx) => {
      if (s.start && s.end && s.start <= weekEndStr && s.end >= weekStartStr) {
        let startCol = 1;
        let endCol = 7;
        
        const startIdx = weekDatesStr.indexOf(s.start);
        if (startIdx !== -1) startCol = startIdx + 1;
        
        const endIdx = weekDatesStr.indexOf(s.end);
        if (endIdx !== -1) endCol = endIdx + 1;
        
        weekStops.push({
          stop: s,
          idx: idx,
          startCol: startCol,
          endCol: endCol,
          span: endCol - startCol + 1
        });
      }
    });

    // Layout slots
    weekStops.sort((a, b) => {
      if (a.startCol !== b.startCol) return a.startCol - b.startCol;
      return b.span - a.span;
    });

    const slots = [];
    weekStops.forEach(ws => {
      let allocatedSlotIdx = -1;
      for (let sIdx = 0; sIdx < slots.length; sIdx++) {
        let fits = true;
        for (let col = ws.startCol; col <= ws.endCol; col++) {
          if (slots[sIdx][col - 1]) {
            fits = false;
            break;
          }
        }
        if (fits) {
          allocatedSlotIdx = sIdx;
          break;
        }
      }
      if (allocatedSlotIdx === -1) {
        slots.push([false, false, false, false, false, false, false]);
        allocatedSlotIdx = slots.length - 1;
      }
      for (let col = ws.startCol; col <= ws.endCol; col++) {
        slots[allocatedSlotIdx][col - 1] = true;
      }
      ws.slotIdx = allocatedSlotIdx;
    });

    // Render Week Row
    let weekHtml = `<div class="calendar-week-row">`;
    
    // Background Grid
    weekHtml += `<div class="calendar-week-bg">`;
    week.forEach(d => {
      const isOther = !d.isCurrentMonth ? ' other-month' : '';
      const dateStr = d.date.toISOString().split('T')[0];
      weekHtml += `<div class="calendar-week-bg-cell${isOther}" data-date="${dateStr}"></div>`;
    });
    weekHtml += `</div>`;

    // Content Grid (Row 1 Day numbers, Row 2+ events)
    weekHtml += `<div class="calendar-week-content" onclick="calSelectStop(-1)">`;
    
    week.forEach((d, colIdx) => {
      const dateStr = d.date.toISOString().split('T')[0];
      const isToday = dateStr === todayStr;
      const todayClass = isToday ? ' today' : '';
      weekHtml += `<div class="calendar-day-num-wrapper${todayClass}" style="grid-column: ${colIdx + 1}; grid-row: 1;">`;
      weekHtml += `<span>${d.dayNum}</span>`;
      weekHtml += `</div>`;
    });

    weekStops.forEach(ws => {
      const isSel = ws.idx === calSelectedIdx;
      const cVal = color(ws.stop);
      const selectedClass = isSel ? ' selected' : '';
      weekHtml += `<div class="calendar-event-bar${selectedClass}" 
                        onclick="event.stopPropagation();calSelectStop(${ws.idx})" 
                        onpointerdown="calHandlePointerDown(event, ${ws.idx}, ${ws.startCol}, ${ws.span})"
                        style="background:${cVal}; grid-column: ${ws.startCol} / span ${ws.span}; grid-row: ${ws.slotIdx + 2};" 
                        title="${ws.stop.n}\n${formatDateRange(ws.stop.start, ws.stop.end)}">`;
      weekHtml += `<div class="resize-handle-left" onpointerdown="event.stopPropagation(); calHandleResizeDown(event, ${ws.idx}, 'left', ${ws.startCol}, ${ws.span})"></div>`;
      weekHtml += `<div class="resize-handle-right" onpointerdown="event.stopPropagation(); calHandleResizeDown(event, ${ws.idx}, 'right', ${ws.startCol}, ${ws.span})"></div>`;
      weekHtml += `${ws.idx + 1}. ${ws.stop.n}`;
      weekHtml += `</div>`;
    });

    weekHtml += `</div>`; // calendar-week-content
    weekHtml += `</div>`; // calendar-week-row
    
    gridWeeksHtml += weekHtml;
  });

  html += `<div class="calendar-weeks-container">`;
  html += gridWeeksHtml;
  html += `</div>`;

  html += `</div>`; // calendar-container

  // ── Detail panel ─────────────────────────────────────
  const det = calSelectedIdx >= 0 ? stops[calSelectedIdx] : null;
  html += `<div class="cal-detail${det ? '' : ' hidden'}" id="cal-detail">`;
  if (det) {
    const d1 = new Date(det.start + 'T00:00:00'), d2 = new Date(det.end + 'T00:00:00');
    const dur = Math.max(1, Math.round((d2 - d1) / 86400000) + 1);
    const cVal = color(det);
    html += `<div style="height:5px;background:linear-gradient(90deg,${cVal},${cVal}77);"></div>`;
    html += `<div class="cal-detail-header">`;
    html += `<div class="det-num">Parada ${calSelectedIdx+1} de ${stops.length}</div>`;
    html += `<div class="det-name">${det.n}</div>`;
    html += `</div>`;
    html += `<div class="cal-detail-body">`;
    if (det.start) {
      html += `<div class="cal-detail-row"><span class="det-icon">📅</span><div class="det-text"><strong>Período</strong>${formatDateRange(det.start, det.end)}${dur>0?' · '+dur+' día'+(dur>1?'s':''):''}</div></div>`;
    } else {
      html += `<div class="cal-detail-row"><span class="det-icon">📅</span><div class="det-text" style="color:#64748b;">Sin fechas — editar parada para asignar</div></div>`;
    }
    if (det.note) {
      html += `<div class="cal-detail-row"><span class="det-icon">📝</span><div class="det-text"><strong>Nota</strong>${det.note}</div></div>`;
    }
    html += `<div class="cal-detail-row"><span class="det-icon">📍</span><div class="det-text"><strong>Coordenadas</strong>${det.lat.toFixed(4)}, ${det.lon.toFixed(4)}</div></div>`;
    html += `</div>`;
    html += `<div class="cal-detail-foot" style="display:flex; flex-direction:column; gap:6px;">`;
    html += `<div style="display:flex; gap:6px; width:100%;">`;
    html += `<button class="det-btn-map" onclick="focusStopOnMap(${calSelectedIdx})">🗺️ Ver en mapa</button>`;
    html += `<button class="det-btn-edit" onclick="editStop(${calSelectedIdx});showTab('map');">✏️ Editar</button>`;
    html += `</div>`;
    html += `<button class="det-btn-delete" onclick="deleteStopFromCalendar(${calSelectedIdx})">🗑️ Eliminar parada</button>`;
    html += `</div>`;
  } else {
    html += `<div style="padding:40px 20px;text-align:center;color:#64748b;">`;
    html += `<div style="font-size:32px;margin-bottom:12px;">📅</div>`;
    html += `<div style="font-size:13px;font-weight:600;color:#64748b;">Clic en una parada<br>para ver detalles</div>`;
    html += `</div>`;
  }
  html += `</div>`; // cal-detail

  html += `</div>`; // cal-layout
  container.innerHTML = html;
}

/* ================= INTERACTION DRAG / RESIZE CALENDAR ================= */
let calDragState = null;

function getWeekRowBounds() {
  const weekRows = Array.from(document.querySelectorAll('.calendar-week-row'));
  return weekRows.map(row => {
    const r = row.getBoundingClientRect();
    return {
      el: row,
      top: r.top,
      bottom: r.bottom,
      left: r.left,
      width: r.width,
      cells: Array.from(row.querySelectorAll('.calendar-week-bg-cell'))
    };
  });
}

function calHandlePointerDown(e, stopIdx, startCol, span) {
  if (e.button !== 0) return; // Left click only
  
  const weekRow = e.currentTarget.closest('.calendar-week-row');
  if (!weekRow) return;
  const rect = weekRow.getBoundingClientRect();
  let colIdx = Math.floor((e.clientX - rect.left) / (rect.width / 7));
  if (colIdx < 0) colIdx = 0;
  if (colIdx > 6) colIdx = 6;
  const cells = weekRow.querySelectorAll('.calendar-week-bg-cell');
  const startDateStr = cells[colIdx]?.getAttribute('data-date');
  if (!startDateStr) return;
  
  const bar = e.currentTarget;
  bar.setPointerCapture(e.pointerId);
  bar.style.opacity = '0.75';
  bar.style.zIndex = '1000';
  bar.style.transition = 'none'; // Disable transition during drag
  
  const stop = state.stops[stopIdx];
  calDragState = {
    type: 'move',
    stopIdx: stopIdx,
    pointerId: e.pointerId,
    initialPointerDate: startDateStr,
    initialStopStart: stop.start,
    initialStopEnd: stop.end,
    initialStartCol: startCol,
    initialSpan: span,
    barEl: bar,
    lastDeltaDays: 0,
    rowBounds: getWeekRowBounds() // Cache week row bounds on down to avoid thrashing layout on move
  };
}

function calHandleResizeDown(e, stopIdx, edge, startCol, span) {
  if (e.button !== 0) return; // Left click only
  
  const bar = e.currentTarget.parentElement;
  const weekRow = bar.closest('.calendar-week-row');
  if (!weekRow) return;
  const rect = weekRow.getBoundingClientRect();
  let colIdx = Math.floor((e.clientX - rect.left) / (rect.width / 7));
  if (colIdx < 0) colIdx = 0;
  if (colIdx > 6) colIdx = 6;
  const cells = weekRow.querySelectorAll('.calendar-week-bg-cell');
  const startDateStr = cells[colIdx]?.getAttribute('data-date');
  if (!startDateStr) return;
  
  bar.setPointerCapture(e.pointerId);
  bar.style.opacity = '0.75';
  bar.style.zIndex = '1000';
  bar.style.transition = 'none'; // Disable transition during drag
  
  const stop = state.stops[stopIdx];
  calDragState = {
    type: 'resize',
    edge: edge,
    stopIdx: stopIdx,
    pointerId: e.pointerId,
    initialPointerDate: startDateStr,
    initialStopStart: stop.start,
    initialStopEnd: stop.end,
    initialStartCol: startCol,
    initialSpan: span,
    barEl: bar,
    lastDeltaDays: 0,
    rowBounds: getWeekRowBounds() // Cache bounds
  };
}

window.addEventListener('pointermove', e => {
  if (!calDragState) return;
  if (e.pointerId !== calDragState.pointerId) return;
  
  // Find which row the pointer is currently over (using cached row bounds)
  let activeRowBound = null;
  for (let bound of calDragState.rowBounds) {
    if (e.clientY >= bound.top && e.clientY <= bound.bottom) {
      activeRowBound = bound;
      break;
    }
  }
  
  // Clamp boundaries if cursor is outside grid top/bottom
  if (!activeRowBound && calDragState.rowBounds.length > 0) {
    if (e.clientY < calDragState.rowBounds[0].top) {
      activeRowBound = calDragState.rowBounds[0];
    } else if (e.clientY > calDragState.rowBounds[calDragState.rowBounds.length - 1].bottom) {
      activeRowBound = calDragState.rowBounds[calDragState.rowBounds.length - 1];
    }
  }
  
  if (!activeRowBound) return;
  
  let colIdx = Math.floor((e.clientX - activeRowBound.left) / (activeRowBound.width / 7));
  if (colIdx < 0) colIdx = 0;
  if (colIdx > 6) colIdx = 6;
  
  const currentDateStr = activeRowBound.cells[colIdx]?.getAttribute('data-date');
  if (!currentDateStr) return;
  
  const dStart = new Date(calDragState.initialPointerDate + 'T00:00:00');
  const dCurrent = new Date(currentDateStr + 'T00:00:00');
  const deltaDays = Math.round((dCurrent - dStart) / 86400000);
  
  if (deltaDays === calDragState.lastDeltaDays) return;
  calDragState.lastDeltaDays = deltaDays;
  
  // Calculate visual state
  let tempStartCol = calDragState.initialStartCol;
  let tempSpan = calDragState.initialSpan;
  
  if (calDragState.type === 'move') {
    tempStartCol = calDragState.initialStartCol + deltaDays;
  } else if (calDragState.type === 'resize') {
    if (calDragState.edge === 'left') {
      tempStartCol = calDragState.initialStartCol + deltaDays;
      tempSpan = calDragState.initialSpan - deltaDays;
      if (tempSpan < 1) {
        tempStartCol = calDragState.initialStartCol + calDragState.initialSpan - 1;
        tempSpan = 1;
      }
    } else {
      tempSpan = calDragState.initialSpan + deltaDays;
      if (tempSpan < 1) tempSpan = 1;
    }
  }
  
  // Update styling instantly
  calDragState.barEl.style.gridColumn = `${tempStartCol} / span ${tempSpan}`;
  
  const currentWeekRow = calDragState.barEl.closest('.calendar-week-row');
  if (activeRowBound.el !== currentWeekRow) {
    const newContent = activeRowBound.el.querySelector('.calendar-week-content');
    if (newContent) {
      newContent.appendChild(calDragState.barEl);
    }
  }
});

window.addEventListener('pointerup', e => {
  if (!calDragState) return;
  if (e.pointerId !== calDragState.pointerId) return;
  
  const bar = calDragState.barEl;
  bar.style.opacity = '';
  bar.style.zIndex = '';
  bar.style.transition = ''; // Restore transition
  
  try {
    bar.releasePointerCapture(e.pointerId);
  } catch(err) {}
  
  const deltaDays = calDragState.lastDeltaDays || 0;
  if (deltaDays !== 0) {
    const stopIdx = calDragState.stopIdx;
    if (calDragState.type === 'move') {
      shiftStopDates(stopIdx, deltaDays, true); // True cascades to all subsequent stops!
    } else if (calDragState.type === 'resize') {
      if (calDragState.edge === 'left') {
        resizeStopLeft(stopIdx, deltaDays);
      } else {
        resizeStopRight(stopIdx, deltaDays);
      }
    }
  } else {
    // If no drag occurred, it is a click/tap. Trigger stop selection!
    calSelectStop(calDragState.stopIdx);
  }
  calDragState = null;
});

function shiftDateStr(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().split('T')[0];
}

function shiftStopDates(stopIdx, deltaDays, shiftSubsequent) {
  if (deltaDays === 0) return;
  for (let j = stopIdx; j < state.stops.length; j++) {
    const s = state.stops[j];
    if (j === stopIdx || shiftSubsequent) {
      if (s.start) s.start = shiftDateStr(s.start, deltaDays);
      if (s.end) s.end = shiftDateStr(s.end, deltaDays);
    }
  }
  save();
  renderAll();
}

function resizeStopRight(stopIdx, deltaDays) {
  if (deltaDays === 0) return;
  const s = state.stops[stopIdx];
  const d1 = new Date(s.start + 'T00:00:00');
  const d2 = new Date(s.end + 'T00:00:00');
  const currentDuration = Math.round((d2 - d1) / 86400000) + 1;
  const newDuration = currentDuration + deltaDays;
  if (newDuration < 1) {
    deltaDays = 1 - currentDuration;
  }
  
  s.end = shiftDateStr(s.end, deltaDays);
  
  // Cascade delta to subsequent stops
  for (let j = stopIdx + 1; j < state.stops.length; j++) {
    const sj = state.stops[j];
    if (sj.start) sj.start = shiftDateStr(sj.start, deltaDays);
    if (sj.end) sj.end = shiftDateStr(sj.end, deltaDays);
  }
  save();
  renderAll();
}

function resizeStopLeft(stopIdx, deltaDays) {
  if (deltaDays === 0) return;
  const s = state.stops[stopIdx];
  const d1 = new Date(s.start + 'T00:00:00');
  const d2 = new Date(s.end + 'T00:00:00');
  const currentDuration = Math.round((d2 - d1) / 86400000) + 1;
  const newDuration = currentDuration - deltaDays;
  if (newDuration < 1) {
    deltaDays = currentDuration - 1;
  }
  
  s.start = shiftDateStr(s.start, deltaDays);
  save();
  renderAll();
}

function deleteStopFromCalendar(idx) {
  if (confirm(`¿Borrar "${state.stops[idx].n}" del viaje?`)) {
    state.stops.splice(idx, 1);
    calSelectedIdx = -1;
    save();
    renderAll();
  }
}

function calPrevMonth() {
  calCurrentDate.setMonth(calCurrentDate.getMonth() - 1);
  renderCalendar();
}

function calNextMonth() {
  calCurrentDate.setMonth(calCurrentDate.getMonth() + 1);
  renderCalendar();
}

function calSetMonth(y, m) {
  calCurrentDate = new Date(y, m, 1);
  renderCalendar();
}

function calSelectStop(idx) {
  calSelectedIdx = (calSelectedIdx === idx) ? -1 : idx;
  renderCalendar();
}

function focusStopOnMap(idx) {
  showTab('map');
  const s = state.stops[idx];
  if (s) {
    map.flyTo([s.lat, s.lon], 8);
    setTimeout(() => {
      markers[idx].openPopup();
    }, 400);
  }
}

function daysBetween(start, end) {
  if (!start || !end) return 0;
  const d1 = new Date(start + 'T00:00:00');
  const d2 = new Date(end + 'T00:00:00');
  return Math.max(1, Math.round((d2 - d1) / 86400000) + 1);
}

function computeFuelKm() {
  let totalKm = 0;
  const stops = state.stops || [];
  for (let i = 0; i < stops.length - 1; i++) {
    const s1 = stops[i];
    const s2 = stops[i+1];
    if (s1.lat && s1.lon && s2.lat && s2.lon) {
      const R = 6371; // Earth radius in km
      const dLat = (s2.lat - s1.lat) * Math.PI / 180;
      const dLon = (s2.lon - s1.lon) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(s1.lat * Math.PI / 180) * Math.cos(s2.lat * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      totalKm += R * c;
    }
  }
  return Math.round(totalKm * 1.25); // Include deviation/local detour factor
}

// Reparto real de días por región (como fracción del total), para poder escalar
// proporcionalmente el escenario del slider "días totales" a cada región sin perder
// las tarifas región-por-región de comida/alojamiento/nafta.
function getRegionDayShares() {
  const trip = computeTripStats();
  const rb = computeRegionBreakdown(trip.countryDays);
  const total = rb.reduce((s, r) => s + r.days, 0) || 1;
  const shares = {};
  rb.forEach(r => { shares[r.region] = r.days / total; });
  return shares;
}

function computeBudgetEstimate(overrideDays) {
  const stops = state.stops || [];
  const realDays = stops.length > 0 ? daysBetween(stops[0].start, stops[stops.length-1].end) : 0;
  // Guarda defensiva: con `!== null` una llamada sin argumento dejaba days en
  // undefined y todo el presupuesto salía NaN. `!= null` cubre null Y undefined.
  const days = (overrideDays != null) ? overrideDays : realDays;

  const perDay = state.budget.perDayUsd;
  const shares = getRegionDayShares();
  let dailyTotal = (perDay.otros || 0) * days;
  REGION_ORDER.forEach(region => {
    const regionDays = days * (shares[region] || 0);
    dailyTotal += (perDay.comida[region] || 0) * regionDays;
    dailyTotal += (perDay.alojamiento[region] || 0) * regionDays;
  });

  const km = computeFuelKm();
  const kmByRegion = computeFuelKmByRegion();
  const fuelParam = state.budget.fuel;
  const fuelRate = (fuelParam.kmPerLiter || 18) / 100;
  let fuelTotal = 0;
  REGION_ORDER.forEach(region => {
    fuelTotal += (kmByRegion[region] || 0) * (fuelParam.pricePerLiter[region] || 0) * fuelRate;
  });

  let oneOffTotal = 0;
  (state.budget.oneOff || []).forEach(o => {
    oneOffTotal += o.amount || 0;
  });

  const subtotal = dailyTotal + fuelTotal + oneOffTotal;
  const contingency = subtotal * ((state.budget.contingencyPct || 20) / 100);

  return {
    days,
    realDays,
    dailyTotal,
    km,
    fuelTotal,
    oneOffTotal,
    contingency,
    total: subtotal + contingency
  };
}

function getCategoryEstimate(cat, days) {
  const perDay = state.budget.perDayUsd;
  const shares = getRegionDayShares();
  let total = 0;
  if (cat === 'comida' || cat === 'alojamiento') {
    REGION_ORDER.forEach(region => {
      const regionDays = days * (shares[region] || 0);
      total += (perDay[cat][region] || 0) * regionDays;
    });
  }
  if (cat === 'otros') total += (perDay.otros || 0) * days;
  if (cat === 'combustible') {
    const kmByRegion = computeFuelKmByRegion();
    const fuelParam = state.budget.fuel;
    const fuelRate = (fuelParam.kmPerLiter || 18) / 100;
    REGION_ORDER.forEach(region => {
      total += (kmByRegion[region] || 0) * (fuelParam.pricePerLiter[region] || 0) * fuelRate;
    });
  }
  // Costos puntuales únicos: cada uno suma a la categoría que tenga asignada (cualquiera)
  (state.budget.oneOff || []).forEach(o => {
    if (o.cat === cat) total += o.amount || 0;
  });
  return total;
}

let tempScenarioDays = null;

function renderExpenses() {
  const container = document.getElementById("expenses-wrap");
  if (!container) return;

  const realDays = (state.stops && state.stops.length > 0) ? daysBetween(state.stops[0].start, state.stops[state.stops.length-1].end) : 0;
  const activeDays = tempScenarioDays !== null ? tempScenarioDays : realDays;

  if (!document.getElementById("expenses-skeleton")) {
    container.innerHTML = `
      <div id="expenses-skeleton">
        <!-- Resumen de Dinero -->

    categoriesList.innerHTML = Object.keys(EXPENSE_CATS).map(c => {
      const catEst = getCategoryEstimate(c, est.days) * contingencyFactor;

function updateScenarioDays(val) {
  const parsed = parseInt(val) || 10;
  tempScenarioDays = parsed;

  const rangeEl = document.getElementById("exp-slider-range");
  const numEl = document.getElementById("exp-slider-num");
  if (rangeEl && rangeEl.value != parsed) rangeEl.value = parsed;
  if (numEl && numEl.value != parsed) numEl.value = parsed;

  updateExpensesUI(parsed);
}

function resetScenarioDays() {
  tempScenarioDays = null;
  const realDays = (state.stops && state.stops.length > 0) ? daysBetween(state.stops[0].start, state.stops[state.stops.length-1].end) : 0;
  
  const rangeEl = document.getElementById("exp-slider-range");
  const numEl = document.getElementById("exp-slider-num");
  if (rangeEl) rangeEl.value = realDays;
  if (numEl) numEl.value = realDays;

  updateExpensesUI(realDays);
}

function updateBudgetSetting(section, key, region, val) {
  if (section === 'perDayUsd') {
    if (region) state.budget.perDayUsd[key][region] = parseFloat(val) || 0;
    else state.budget.perDayUsd[key] = parseFloat(val) || 0; // 'otros', queda plano en toda la ruta
  } else if (section === 'fuel') {
    if (region) state.budget.fuel.pricePerLiter[region] = parseFloat(val) || 0;
    else state.budget.fuel[key] = parseFloat(val) || 0; // kmPerLiter (consumo del vehículo, no varía por región)
  } else if (section === 'contingencyPct') {
    state.budget.contingencyPct = parseFloat(val) || 0;
  }
  save();
  const activeDays = tempScenarioDays !== null ? tempScenarioDays : ((state.stops && state.stops.length > 0) ? daysBetween(state.stops[0].start, state.stops[state.stops.length-1].end) : 0);
  updateExpensesUI(activeDays);
}

// Consumo ingresado en MPG (como marca el tablero de la F-150) y convertido a
// L/100km para el resto de la app: L/100km = 235.215 / MPG.
function updateFuelMpg(mpgVal) {
  const mpg = parseFloat(mpgVal);
  if (!mpg || mpg <= 0) return;
  state.budget.fuel.kmPerLiter = 235.215 / mpg;
  save();
  const activeDays = tempScenarioDays !== null ? tempScenarioDays : ((state.stops && state.stops.length > 0) ? daysBetween(state.stops[0].start, state.stops[state.stops.length-1].end) : 0);
  updateExpensesUI(activeDays);
}

function updateOneOffAmount(idx, val) {
  state.budget.oneOff[idx].amount = parseFloat(val) || 0;
  save();
  const activeDays = tempScenarioDays !== null ? tempScenarioDays : ((state.stops && state.stops.length > 0) ? daysBetween(state.stops[0].start, state.stops[state.stops.length-1].end) : 0);
  updateExpensesUI(activeDays);
}

/* ================= DASHBOARD ================= */

// No existe un campo "country" en state.stops: se infiere del nombre (n) y, en un
// caso puntual, de la nota (note). El viaje es lineal (un país a la vez, en orden
// cronológico) así que alcanza con esta tabla de keywords + "carry-forward".
const COUNTRY_PATTERNS = [
  // Ya no son países: la Expedición EEUU se divide por ESTADO, y los estados se
  // agrupan en 4 regiones (ver REGION_BY_COUNTRY). Se detecta por la sigla del
  // estado al final del nombre de la parada, ej. "Cody, WY".
  { country: "Tennessee",      re: /,\s*TN\b|chattanooga/i },
  { country: "Kentucky",       re: /,\s*KY\b/i },
  { country: "Missouri",       re: /,\s*MO\b/i },
  { country: "Nebraska",       re: /,\s*NE\b/i },
  { country: "Dakota del Sur", re: /,\s*SD\b/i },
  { country: "Wyoming",        re: /,\s*WY\b/i },
  { country: "Montana",        re: /,\s*MT\b/i },
  { country: "Idaho",          re: /,\s*ID\b/i },
  { country: "Washington",     re: /,\s*WA\b/i },
  { country: "Oregon",         re: /,\s*OR\b/i },
  { country: "California",     re: /,\s*CA\b|\bLAX\b/i }
];

// Quita frases de cruce ("cruce a X" / "paso a X" / "entrada a X") del nombre antes
// de buscar el estado (legado del plan Panamericana; se conserva por compatibilidad).
// En la Expedición EEUU no hay cruces de frontera, así que no tiene efecto.


function stripCrossingPhrase(name) {
  return String(name || "").replace(/\b(cruce|paso|entrada)\s+a\s+\S+/gi, "");
}

// Bandera de máxima prioridad: nota tipo "¡Ya en Argentina!".
function detectNoteCountryFlag(note) {
  const m = String(note || "").match(/ya en ([a-záéíóúñ]+(?:\s+[a-záéíóúñ]+)?)/i);
  if (!m) return null;
  const candidate = m[1].trim().toLowerCase();
  const found = COUNTRY_PATTERNS.find(p => p.country.toLowerCase() === candidate);
  return found ? found.country : null;
}

function inferStopCountry(stop, prevCountry) {
  const flagged = detectNoteCountryFlag(stop.note);
  if (flagged) return flagged;
  const cleanName = stripCrossingPhrase(stop.n);
  for (const p of COUNTRY_PATTERNS) {
    if (p.re.test(cleanName)) return p.country;
  }
  return prevCountry || "Tennessee";
}

// Recorre las paradas (ya ordenadas cronológicamente) con un cursor de fecha,
// recortando cada rango contra lo ya contado para no duplicar días cuando dos
// paradas hermanas comparten fechas (ej. Yellowstone y Grand Teton). Los días de
// tránsito entre el fin de una parada y el inicio de la siguiente (si no son
// contiguos) se cuentan para el país de la parada anterior. Devuelve los países
// en el orden en que aparecen por primera vez en el viaje.
function computeCountryDays() {
  const stops = (state.stops || []).filter(s => s.start && s.end);
  const result = [];
  const indexByCountry = new Map();
  const addDays = (country, days) => {
    if (days <= 0) return;
    if (!indexByCountry.has(country)) {
      indexByCountry.set(country, result.length);
      result.push({ country, days: 0 });
    }
    result[indexByCountry.get(country)].days += days;
  };

  let prevCountry = "Tennessee";
  let cursor = null; // último día ya contado (inclusive)

  stops.forEach(stop => {
    const country = inferStopCountry(stop, prevCountry);
    const end = new Date(stop.end + 'T00:00:00');
    let start = new Date(stop.start + 'T00:00:00');

    if (cursor) {
      const gapStart = new Date(cursor.getTime() + 86400000);
      if (gapStart < start) {
        addDays(prevCountry, Math.round((start - gapStart) / 86400000));
      }
      if (start <= cursor) start = new Date(cursor.getTime() + 86400000);
    }

    prevCountry = country;
    if (start <= end) {
      addDays(country, Math.round((end - start) / 86400000) + 1);
      if (!cursor || end > cursor) cursor = end;
    }
  });

  return result;
}

const REGION_BY_COUNTRY = {
  "Tennessee": "Medio Oeste",
  "Kentucky": "Medio Oeste",
  "Missouri": "Medio Oeste",
  "Nebraska": "Medio Oeste",
  "Dakota del Sur": "Montañas",
  "Wyoming": "Montañas",
  "Montana": "Montañas",
  "Idaho": "Montañas",
  "Washington": "Noroeste",
  "Oregon": "Noroeste",
  "California": "California"
};
const REGION_ORDER = ["Medio Oeste", "Montañas", "Noroeste", "California"];
const REGION_COLORS = {
  "Medio Oeste": "#2a78d6",
  "Montañas": "#eb6834",
  "Noroeste": "#1baf7a",
  "California": "#eda100"
};

function computeRegionBreakdown(countryDays) {
  const totals = { "Medio Oeste": 0, "Montañas": 0, "Noroeste": 0, "California": 0 };
  let grandTotal = 0;
  countryDays.forEach(({ country, days }) => {
    const region = REGION_BY_COUNTRY[country] || "Medio Oeste";
    totals[region] += days;
    grandTotal += days;
  });
  return REGION_ORDER.map(region => ({
    region,
    days: totals[region],
    pct: grandTotal > 0 ? (totals[region] / grandTotal) * 100 : 0
  }));
}

// Mismo cálculo de km que computeFuelKm() (haversine × 1.25 de desvío), pero
// tramo por tramo en vez de un total único, para poder repartir el km entre
// regiones. Cada tramo se asigna a la región de la parada de LLEGADA (a qué
// región nos "movimos" manejando ese tramo), usando el mismo inferStopCountry
// con cursor de país que ya usa computeCountryDays.
function computeFuelKmByRegion() {
  const stops = state.stops || [];
  const totals = { "Medio Oeste": 0, "Montañas": 0, "Noroeste": 0, "California": 0 };
  let prevCountry = "Tennessee";
  const countries = stops.map(s => {
    const c = inferStopCountry(s, prevCountry);
    prevCountry = c;
    return c;
  });
  for (let i = 0; i < stops.length - 1; i++) {
    const s1 = stops[i], s2 = stops[i + 1];
    if (s1.lat && s1.lon && s2.lat && s2.lon) {
      const R = 6371;
      const dLat = (s2.lat - s1.lat) * Math.PI / 180;
      const dLon = (s2.lon - s1.lon) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(s1.lat * Math.PI / 180) * Math.cos(s2.lat * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const km = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * 1.25;
      const region = REGION_BY_COUNTRY[countries[i + 1]] || "Medio Oeste";
      totals[region] += km;
    }
  }
  return totals;
}

// Gasto estipulado por región: reparte los mismos drivers que usa
// computeBudgetEstimate() (comida+alojamiento+otros por DÍA, combustible por KM)
// según los días y km de cada región, para poder comparar el ritmo real de gasto
// contra el presupuesto mientras se viaja. Los costos puntuales (oneOff: ferries,
// TIPs, seguros, etc.) quedan afuera a propósito -- no dependen de días/km sino
// de trámites puntuales, así que no se pueden repartir de forma proporcional.
function computeRegionExpenses(regionBreakdown) {
  const perDay = state.budget.perDayUsd;
  const fuelParam = state.budget.fuel;
  const fuelConsumeRate = (fuelParam.kmPerLiter || 18) / 100;
  const kmByRegion = computeFuelKmByRegion();
  const contingencyFactor = 1 + (state.budget.contingencyPct || 20) / 100;

  return regionBreakdown.map(r => {
    const km = kmByRegion[r.region] || 0;
    // Tarifas propias de la región (comida/alojamiento/nafta), "otros" sigue plano.
    const dailyRate = (perDay.comida[r.region] || 0) + (perDay.alojamiento[r.region] || 0) + (perDay.otros || 0);
    const fuelPrice = fuelParam.pricePerLiter[r.region] || 0;
    const dailyCost = dailyRate * r.days;
    const fuelCost = km * fuelPrice * fuelConsumeRate;
    const total = (dailyCost + fuelCost) * contingencyFactor;
    return {
      region: r.region,
      days: r.days,
      km: Math.round(km),
      dailyCost,
      fuelCost,
      total,
      perDayRate: r.days > 0 ? total / r.days : 0
    };
  });
}

// No hay campo explícito de "día de manejo" en los datos: se estima a partir de
// las horas totales de ruta (mismo cálculo que usa el sidebar del Mapa) dividido
// por una cantidad asumida de horas de manejo por día.
const ASSUMED_DRIVE_HOURS_PER_DAY = 5.5;

function computeTripStats() {
  const stops = state.stops || [];
  const withDates = stops.filter(s => s.start && s.end);
  const tripDays = withDates.length
    ? Math.round((Math.max(...withDates.map(s => new Date(s.end + 'T00:00:00')))
                 - Math.min(...withDates.map(s => new Date(s.start + 'T00:00:00')))) / 86400000) + 1
    : 0;

  // Mismo cálculo que renderList() en el sidebar del Mapa (legEstimate por tramo),
  // así el total del tablero coincide con lo que ya se ve ahí. No se reutiliza
  // computeFuelKm() para esto: usa un factor de desvío distinto (1.25 vs 1.3 de
  // legEstimate) y está pensada solo como insumo del presupuesto de combustible.
  let totalKm = 0, totalHours = 0;
  for (let i = 0; i < stops.length - 1; i++) {
    const leg = legEstimate(stops[i], stops[i + 1]);
    totalKm += leg.km;
    totalHours += leg.hours;
  }

  const countryDays = computeCountryDays();

  return {
    tripDays,
    totalKm,
    totalHours,
    estimatedDrivingDays: Math.ceil(totalHours / ASSUMED_DRIVE_HOURS_PER_DAY),
    countryDays,
    countriesCount: countryDays.length
  };
}

function computeShopProgress() {
  const items = (state.items || []).filter(x => COMPRA_CATS.includes(x.cat));
  const done = items.filter(x => x.done).length;
  return { done, total: items.length, pct: items.length ? Math.round(done / items.length * 100) : 0 };
}

function computeTramitesProgress() {
  const items = (state.items || []).filter(x => TRAMITE_CATS.includes(x.cat));
  const done = items.filter(x => x.done).length;
  return { done, total: items.length, pct: items.length ? Math.round(done / items.length * 100) : 0 };
}

// Extraído de renderSales() para no duplicar la lógica de totales en el tablero.
function computeSalesSummary() {
  const sales = state.sales || [];
  let totalSales = 0, totalSold = 0, totalInSale = 0;
  sales.forEach(s => {
    const val = parseFloat(s.price) || 0;
    totalSales += val;
    if (s.status === "vendido") totalSold += val;
    else totalInSale += val;
  });
  const soldPct = totalSales > 0 ? (totalSold / totalSales) * 100 : 0;
  return { totalSales, totalSold, totalInSale, soldPct };
}

function computeFundingPct(salesSummary, budgetEstimate) {
  if (!budgetEstimate || !budgetEstimate.total) return 0;
  return (salesSummary.totalSales / budgetEstimate.total) * 100;
}

function computeDepartureStatus() {
  const stops = state.stops || [];
  if (!stops.length) return { mode: 'sin-datos' };
  const first = stops[0], last = stops[stops.length - 1];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const start = new Date(first.start + 'T00:00:00');
  const end = new Date(last.end + 'T00:00:00');

  if (today < start) {
    return { mode: 'cuenta-regresiva', daysLeft: Math.round((start - today) / 86400000), startDate: first.start };
  }
  const totalDays = Math.round((end - start) / 86400000) + 1;
  if (today <= end) {
    const dayNumber = Math.round((today - start) / 86400000) + 1;
    return { mode: 'en-curso', dayNumber, totalDays, pct: Math.min(100, Math.round(dayNumber / totalDays * 100)) };
  }
  return { mode: 'finalizado', totalDays };
}

// Gráfico de barras horizontales de días por país (evita rotar 14 etiquetas largas
// como haría un gráfico vertical). Color por región (mismos 4 colores que la barra
// de composición por región), en orden cronológico de aparición en el viaje.
function buildCountryBarChartSVG(countryDays) {
  const rowH = 20, gap = 6, labelW = 118, chartW = 380, padTop = 6, padSide = 8;
  const maxDays = Math.max(1, ...countryDays.map(c => c.days));
  const svgW = labelW + chartW + padSide + 46;
  const svgH = padTop * 2 + countryDays.length * (rowH + gap) - gap;

  const rows = countryDays.map((c, i) => {
    const region = REGION_BY_COUNTRY[c.country] || 'Sudamérica';
    const color = REGION_COLORS[region] || '#52514e';
    const y = padTop + i * (rowH + gap);
    const barW = Math.max(4, (c.days / maxDays) * chartW);
    return `<text x="${labelW - 8}" y="${y + rowH / 2 + 4}" text-anchor="end" font-size="11.5" fill="#52514e">${esc(c.country)}</text>` +
           `<rect x="${labelW}" y="${y}" width="${barW}" height="${rowH}" rx="4" fill="${color}"></rect>` +
           `<text x="${labelW + barW + 6}" y="${y + rowH / 2 + 4}" font-size="11.5" font-weight="700" fill="#0b0b0b">${c.days}d</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${svgW} ${svgH}" width="100%" height="${svgH}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Días por estado">${rows}</svg>`;
}

// Gráfico de dona genérico (composición por región / gasto por categoría): un
// anillo por segmento (stroke-dasharray sobre un círculo), con un pequeño hueco de
// separación entre segmentos y un valor central. Los % y montos exactos se leen en
// la leyenda de al lado (más preciso que etiquetar cada porción sobre el anillo).
function buildDonutChartSVG(segments, centerLabel, centerSub) {
  const size = 168, stroke = 26, gapDeg = 2.2;
  const r = (size - stroke) / 2, cx = size / 2, cy = size / 2;
  const circumference = 2 * Math.PI * r;
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;

  let cursorDeg = -90;
  const arcs = segments.filter(s => s.value > 0).map(seg => {
    const segDeg = (seg.value / total) * 360;
    const drawDeg = Math.max(0, segDeg - (segments.length > 1 ? gapDeg : 0));
    const dash = (drawDeg / 360) * circumference;
    const rotate = cursorDeg;
    cursorDeg += segDeg;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${stroke}" stroke-dasharray="${dash} ${circumference - dash}" transform="rotate(${rotate} ${cx} ${cy})"></circle>`;
  }).join('');

  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gráfico de composición">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#eef1f4" stroke-width="${stroke}"></circle>
    ${arcs}
    <text x="${cx}" y="${cy - 3}" text-anchor="middle" font-size="18" font-weight="800" fill="#0b0b0b">${esc(String(centerLabel))}</text>
    <text x="${cx}" y="${cy + 15}" text-anchor="middle" font-size="10" fill="#64748b">${esc(String(centerSub))}</text>
  </svg>`;
}

function renderDashboard() {
  const container = document.getElementById("dashboard-wrap");
  if (!container) return;

  const trip = computeTripStats();
  const shop = computeShopProgress();
  const tramites = computeTramitesProgress();
  const budget = computeBudgetEstimate(trip.tripDays);
  const sales = computeSalesSummary();
  const fundingPct = computeFundingPct(sales, budget);
  const departure = computeDepartureStatus();
  const regionBreakdown = computeRegionBreakdown(trip.countryDays);
  const regionExpenses = computeRegionExpenses(regionBreakdown);

  const money = n => `$${Math.round(n).toLocaleString('es-AR')}`;

  let heroHtml;
  if (departure.mode === 'cuenta-regresiva') {
    heroHtml = `<div class="dash-hero-top"><div><div class="dash-hero-val">🚀 ${departure.daysLeft} días</div><div class="dash-hero-lbl">Para la salida — ${esc(formatDateRange(departure.startDate, departure.startDate))}</div></div></div>`;
  } else if (departure.mode === 'en-curso') {
    heroHtml = `<div class="dash-hero-top"><div><div class="dash-hero-val">🚗 Día ${departure.dayNumber} de ${departure.totalDays}</div><div class="dash-hero-lbl">Viaje en curso — ${departure.pct}%</div></div></div><div class="dash-hero-bar"><div style="width:${departure.pct}%"></div></div>`;
  } else if (departure.mode === 'finalizado') {
    heroHtml = `<div class="dash-hero-top"><div><div class="dash-hero-val">🏁 Viaje completado</div><div class="dash-hero-lbl">${departure.totalDays} días recorridos</div></div></div>`;
  } else {
    heroHtml = `<div class="dash-hero-top"><div><div class="dash-hero-val">Sin itinerario cargado</div></div></div>`;
  }

  // — Grupo 1: Itinerario —
  const itinerarioHtml = [
    { val: trip.tripDays, lbl: 'Días de viaje' },
    { val: Math.round(trip.totalKm).toLocaleString('es-AR'), sub: 'km', lbl: 'Km de ruta' },
    { val: `~${trip.estimatedDrivingDays}`, sub: 'días', lbl: 'Manejo estimado' },
    { val: trip.countriesCount, lbl: 'Estados recorridos' }
  ].map(k => `<div class="dash-tile"><div class="val">${k.val}</div>${k.sub ? `<div class="sub">${k.sub}</div>` : ''}<div class="lbl">${k.lbl}</div></div>`).join('');

  // — Grupo 2: Preparativos (con mini-barra de progreso) —
  const prepTile = (pct, doneTotal, lbl, color) => `<div class="dash-tile">
      <div class="val">${pct}%</div>
      <div class="bar"><div style="width:${pct}%; background:${color};"></div></div>
      <div class="lbl">${lbl}</div><div class="sub">${doneTotal}</div>
    </div>`;
  const preparativosHtml =
    prepTile(shop.pct, `${shop.done}/${shop.total}`, 'Compras', '#16a34a') +
    prepTile(tramites.pct, `${tramites.done}/${tramites.total}`, 'Trámites', '#ea580c');

  // — Grupo 3: Finanzas —
  const financeTile = (fundingPct > 0)
    ? `<div class="dash-tile"><div class="val">${fundingPct.toFixed(0)}%</div><div class="bar"><div style="width:${Math.min(100, fundingPct)}%; background:#7c3aed;"></div></div><div class="lbl">Financiado c/ventas</div></div>`
    : `<div class="dash-tile"><div class="val">0%</div><div class="bar"><div style="width:0%; background:#7c3aed;"></div></div><div class="lbl">Financiado c/ventas</div></div>`;
  const finanzasHtml =
    `<div class="dash-tile"><div class="val">${money(budget.total)}</div><div class="lbl">Gastos estipulados</div></div>` +
    `<div class="dash-tile"><div class="val">${money(sales.totalSales)}</div><div class="lbl">Ventas estipuladas</div></div>` +
    financeTile;

  const legendHtml = REGION_ORDER.map(r => `<span><span class="dot" style="background:${REGION_COLORS[r]}"></span>${r}</span>`).join('');

  // — Dona: composición por región —
  const regionWithDays = regionBreakdown.filter(r => r.days > 0);
  const regionDonut = buildDonutChartSVG(
    regionWithDays.map(r => ({ value: r.days, color: REGION_COLORS[r.region] })),
    trip.tripDays, 'días totales'
  );
  const regionLegendHtml = regionWithDays.map(r => `<div class="dash-donut-legend-item">
      <span class="name"><span class="dot" style="background:${REGION_COLORS[r.region]};"></span>${r.region}</span>
      <span class="amt">${r.days}d <span class="pct">(${r.pct.toFixed(0)}%)</span></span>
    </div>`).join('');

  // — Dona: gasto estipulado por categoría —
  const contingencyFactor = 1 + (state.budget.contingencyPct || 15) / 100;
  const catData = Object.keys(EXPENSE_CATS).map(c => {
    const catEst = getCategoryEstimate(c, trip.tripDays) * contingencyFactor;
    const catPct = budget.total > 0 ? (catEst / budget.total) * 100 : 0;
    return { key: c, label: EXPENSE_CATS[c].t, color: EXPENSE_CATS[c].c, amount: catEst, pct: catPct };
  });
  const catDonut = buildDonutChartSVG(
    catData.map(c => ({ value: c.amount, color: c.color })),
    money(budget.total), 'total estipulado'
  );
  const catLegendHtml = catData.map(c => `<div class="dash-donut-legend-item">
      <span class="name"><span class="dot" style="background:${c.color};"></span>${c.label}</span>
      <span class="amt">${money(c.amount)} <span class="pct">(${c.pct.toFixed(0)}%)</span></span>
    </div>`).join('');

  // — Dona: gasto estipulado por región (comida+alojamiento+otros por día + combustible por km, prorrateados) —
  const regionExpWithVal = regionExpenses.filter(r => r.total > 0);
  const regionExpTotal = regionExpenses.reduce((s, r) => s + r.total, 0);
  const regionExpDonut = buildDonutChartSVG(
    regionExpWithVal.map(r => ({ value: r.total, color: REGION_COLORS[r.region] })),
    money(regionExpTotal), 'gasto estipulado'
  );
  const regionExpLegendHtml = regionExpWithVal.map(r => `<div class="dash-donut-legend-item">
      <span class="name"><span class="dot" style="background:${REGION_COLORS[r.region]};"></span>${r.region}</span>
      <span class="amt">${money(r.total)} <span class="pct">(~${money(r.perDayRate)}/día)</span></span>
    </div>`).join('');

  container.innerHTML = `
    <div class="dash-hero-card">${heroHtml}</div>

    <div class="dash-groups">
      <div class="dash-group" style="--dash-accent:#1565c0;">
        <div class="dash-group-title">🗺️ Itinerario</div>
        <div class="dash-group-grid">${itinerarioHtml}</div>
      </div>
      <div class="dash-group" style="--dash-accent:#16a34a;">
        <div class="dash-group-title">✅ Preparativos</div>
        <div class="dash-group-grid">${preparativosHtml}</div>
      </div>
      <div class="dash-group" style="--dash-accent:#7c3aed;">
        <div class="dash-group-title">💰 Finanzas</div>
        <div class="dash-group-grid">${finanzasHtml}</div>
      </div>
    </div>

    <div class="dash-chart-card">
      <div class="expense-section-title">🇺🇸 Días por estado</div>
      <div class="dash-legend">${legendHtml}</div>
      ${buildCountryBarChartSVG(trip.countryDays)}
    </div>

    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap:20px;">
      <div class="dash-chart-card">
        <div class="expense-section-title">🗺️ Composición del viaje por región</div>
        <div class="dash-donut-row">${regionDonut}<div class="dash-donut-legend">${regionLegendHtml}</div></div>
      </div>
      <div class="dash-chart-card">
        <div class="expense-section-title">💵 Gasto estipulado por categoría</div>
        <div class="dash-donut-row">${catDonut}<div class="dash-donut-legend">${catLegendHtml}</div></div>
      </div>
      <div class="dash-chart-card">
        <div class="expense-section-title">🧭 Gasto estipulado por región</div>
        <div class="dash-donut-row">${regionExpDonut}<div class="dash-donut-legend">${regionExpLegendHtml}</div></div>
        <div style="font-size:11px; color:#94a3b8; margin-top:10px; line-height:1.4;">Comida + alojamiento + otros por día, y combustible por km, prorrateados por región. No incluye costos puntuales (ferries, TIPs, seguros) — esos no dependen de días/km. Usalo para comparar el ritmo real de gasto contra esto mientras viajan.</div>
      </div>
    </div>
  `;
}

// Controlar pestaña visible por medio del hash de la URL (#mapa, #compras, #tramites o #calendario)
function checkHashTab() {
  const h = window.location.hash;
  if (h === '#compras' || h === '#shop') {
    showTab('shop');
  } else if (h === '#tramites') {
    showTab('tramites');
  } else if (h === '#cal' || h === '#calendario' || h === '#calendar') {
    showTab('cal');
  } else if (h === '#gastos' || h === '#expenses') {
    showTab('expenses');
  } else if (h === '#ventas' || h === '#sales') {
    showTab('sales');
  } else if (h === '#dashboard' || h === '#tablero') {
    showTab('dashboard');
  } else {
    showTab('map');
  }
}
window.addEventListener('hashchange', checkHashTab);
checkHashTab(); // Ejecutar inmediatamente al cargar la página

/* ══════════════ PWA: service worker e indicador de conexión ══════════════ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .catch(e => console.warn('SW no registrado:', e.message));
  });
}

// Los datos viven en Firestore: sin señal la app abre (gracias al SW) pero lo
// que edites no se sincroniza hasta que vuelva la conexión. Mostrarlo evita
// que carguen un gasto en Wyoming creyendo que quedó guardado.
function paintNetBadge() {
  const el = document.getElementById('net-badge');
  if (!el) return;
  const on = navigator.onLine;
  el.className = on ? 'on' : 'off';
  el.textContent = on ? '● sincronizado' : '● sin señal — no guarda';
  el.title = on
    ? 'Conectado: los cambios se guardan en Firestore y los ven los dos.'
    : 'Sin conexión: podés mirar, pero lo que edites no se sincroniza hasta que vuelva la señal.';
}
window.addEventListener('online', paintNetBadge);
window.addEventListener('offline', paintNetBadge);
paintNetBadge();
